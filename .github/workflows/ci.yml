# B-10: checks for every pull request and for main.
# The jobs below are meant to be required status checks in branch protection for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Model integration must never reach a real endpoint from CI (CLAUDE.md, ADR-0002).
  ANTHROPIC_BASE_URL: ""
  ANTHROPIC_API_KEY: ""

jobs:
  backend:
    name: Backend (./gradlew check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check (unit, Testcontainers integration, module boundaries)
        run: ./gradlew check --console=plain

  runtime-safety:
    # Tool-calling boundary tests (ADR-0002). They live in the spike until the Agent Runtime
    # exists in backend/intelligence; then they move there and this job is removed.
    name: Runtime safety (tool-calling boundary)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spikes/stack-compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test
        run: ./gradlew test --console=plain

  frontend:
    name: Frontend (typecheck, unit tests, API client, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install (pnpm via corepack, version from package.json)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Generated API client matches contracts/openapi
        run: pnpm check:api
      - name: Build
        run: pnpm build
      - name: Known vulnerabilities in runtime dependencies
        run: pnpm audit --prod --audit-level high

  frontend-e2e:
    # Sign-in and store switching against real Keycloak, Postgres and the backend (B-09).
    name: Frontend e2e (Keycloak, backend, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Start Postgres, Keycloak and Temporal
        working-directory: infra
        run: docker compose up -d --wait --wait-timeout 300 postgres keycloak temporal
      - name: Start backend (profiles api,local)
        working-directory: backend
        run: |
          ./gradlew bootJar --console=plain
          nohup java -jar build/libs/ecommerce-agent-backend-0.1.0-SNAPSHOT.jar --spring.profiles.active=api,local \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"; exit 1
      - name: Build frontend and install Chromium
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: pnpm test:e2e
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/backend.log" || true
          docker compose -f infra/docker-compose.yml logs --tail 100 keycloak
      - name: Stop environment
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  infra-smoke:
    name: Local environment (docker compose smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: docker compose config -q
      - name: Start environment
        run: docker compose up -d --wait --wait-timeout 420
      - name: Seed finished successfully
        run: |
          docker compose wait woo-seed > /dev/null || true
          docker compose logs woo-seed | tail -n 5
          test "$(docker compose ps -a woo-seed --format '{{.ExitCode}}')" = "0"
      - name: Services respond
        run: |
          curl -fsS http://localhost:8180/realms/operator/.well-known/openid-configuration > /dev/null
          curl -fsS http://localhost:8233/ > /dev/null
          curl -fsS http://localhost:8025/api/v1/messages > /dev/null
          curl -fsS -o /dev/null http://localhost:8081/wp-json/wc/v3
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop environment
        if: always()
        run: docker compose down -v
