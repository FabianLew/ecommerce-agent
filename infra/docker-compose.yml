# Local development environment (B-05). Local-only credentials; never reuse them elsewhere.
# Start: docker compose -f infra/docker-compose.yml up -d   (details: infra/README.md)
name: ecommerce-agent

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
      POSTGRES_DB: operator
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    # Temporal CLI dev server: frontend on 7233, Web UI on 8233, state in a SQLite file.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      # Mounted over the image user's home so the volume inherits its ownership (uid 1000).
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port", "8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  jaeger:
    # Local trace viewer. Backend exports OTLP over HTTP when OTEL_EXPORT_ENABLED=true.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "4318:4318"
      - "16686:16686"

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

  woo-db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
      TZ: UTC
    volumes:
      - woo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  woocommerce:
    image: wordpress:7.1.3-php8.3-apache
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    ports:
      - "8081:80"
    # Webhooks from the local store reach the API on the host (ADR-0009).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - woo-html:/var/www/html
    depends_on:
      woo-db:
        condition: service_healthy

  woo-seed:
    # One-shot: installs WordPress + WooCommerce and creates the test store (idempotent).
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33" # same uid as www-data in the wordpress (Debian) image, so both can write the volume
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WOO_URL: http://localhost:8081
      WOOCOMMERCE_VERSION: 11.2.1
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - woo-html:/var/www/html
      - ./woocommerce/seed.sh:/seed/seed.sh:ro
    entrypoint: ["sh", "/seed/seed.sh"]
    depends_on:
      woo-db:
        condition: service_healthy
      woocommerce:
        condition: service_started
    restart: "no"

volumes:
  postgres-data:
  temporal-data:
  woo-db-data:
  woo-html:
