# Profile "local": development against infra/docker-compose. Adds demo tenants matching the
# Keycloak users owner-a / owner-b (fixed IDs in infra/keycloak/operator-realm.json).
# Use together with api or worker, e.g. --spring.profiles.active=api,local
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/local

operator:
  integration:
    # Local development key only. Never use it outside the local docker compose environment.
    secrets-key: ${INTEGRATION_SECRETS_KEY:2C5y2DMN6l64uxs1CeLtgJgw5tDMik2fYYHzg5uwX/8=}
    secrets-key-id: local-v1
    woocommerce:
      # The local test store runs on http://localhost:8081 (OAuth 1.0a signatures, ADR-0007).
      allow-insecure-http: true
      allow-private-network: true
    webhooks:
      # The Woo container reaches the API on the host through host.docker.internal (infra/docker-compose.yml).
      base-url: ${WEBHOOK_BASE_URL:http://host.docker.internal:8080}
