spring:
  application:
    name: ecommerce-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/operator}
    # The runtime role (ADR-0022): owns nothing, subject to every row-level security policy.
    username: ${DB_USERNAME:operator_runtime}
    password: ${DB_PASSWORD:operator_runtime}
  flyway:
    locations: classpath:db/migration
    # Migrations run as the owner of the schema, never as the runtime role. In the cloud profile they run only in
    # the separate migration step (ADR-0023); locally and in tests on start, with the migrator's own connection.
    user: ${DB_MIGRATION_USERNAME:operator_migrator}
    password: ${DB_MIGRATION_PASSWORD:operator_migrator}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/operator}
          # Tokens must be minted for this API, not just by the same identity provider.
          audiences: ${OIDC_AUDIENCE:operator-api}
  jackson:
    time-zone: UTC
  ai:
    anthropic:
      # The key comes only from the environment; the placeholder keeps the context starting without one.
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      base-url: ${OPERATOR_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      # Retries and fallback belong to the agent runtime (ADR-0016).
      max-retries: 0
    chat:
      client:
        tool-calling:
          # ADR-0002: tool calls are returned to our runtime, never executed by Spring AI.
          enabled: false
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers-auto-discovery:
      packages: com.ecommerceagent.automation
    # Workers run only in the "worker" profile; "api" uses the client to start workflows.
    start-workers: false

operator:
  integration:
    # Base64 of 32 random bytes (AES-256). Required; never reuse the local key elsewhere (ADR-0007).
    secrets-key: ${INTEGRATION_SECRETS_KEY:}
    secrets-key-id: ${INTEGRATION_SECRETS_KEY_ID:v1}
    woocommerce:
      allow-insecure-http: false
      allow-private-network: false
      connect-timeout: 5s
      # Deadline for the whole response, headers and body (FIX-01).
      response-timeout: 30s
    webhooks:
      # Public address of this API that shops deliver webhooks to (ADR-0009), e.g. https://api.example.com
      base-url: ${WEBHOOK_BASE_URL:}
      processor-enabled: true
      processor-interval: 2s
    meta:
      # Fixed Meta host and pinned version (ADR-0017); only the local and test profiles may use a stub.
      graph-base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com}
      api-version: v23.0
      connect-timeout: 5s
      timeout: 20s
      poll-interval: 30s
      min-backoff: 60s
      poller-enabled: true
  automation:
    # Outbox → Temporal (ADR-0010); runs in the worker profile.
    dispatcher-enabled: true
    dispatcher-interval: 1s
    inventory:
      # Fresh read after a verification request, and after an order change without a newer stock state.
      verify-delay: 10s
      order-delay: 60s
    catalog:
      refresh-delay: 30s
    sync:
      # Temporal Schedules per connection (ADR-0010); the worker creates missing ones every minute.
      schedules-enabled: true
      poll-interval: 5m
      reconcile-interval: 1h
    history:
      # Order history of 12 months, read backward in 30-day chunks after the initial import (ADR-0015).
      enabled: true
      interval: 10m
      max-chunks-per-run: 6
      pause: 2s

  inventory-guardian:
    risk:
      # Detector inventory-risk/1 (ADR-0011): risk is days of cover below the threshold; an episode opens after
      # min-observations current risk observations at least min-gap apart, with stock no older than max-stock-age.
      threshold-days: 3
      min-observations: 2
      min-gap: 5m
      max-stock-age: 120s
    workflow:
      # Episode limits (ADR-0012): proposal validity, episode time limit, retries when data is missing.
      proposal-ttl: 24h
      episode-timeout: 7d
      data-retry-delay: 15m
      max-data-retries: 3
      max-reanalyses: 5
      # A risk update changing days of cover by at least this much starts a new revision.
      significant-cover-change: 0.5
  policies:
    inventory-protection:
      # Policy inventory-protection@1.0.0 (ADR-0012); the pilot only evaluates (L1, L2 disabled).
      version: 1.0.0
      mode: EVALUATION_ONLY
      max-stock-age: 120s
      max-ad-state-age: 60s
      max-verification-age: 24h
      autonomy: L1
      l2-enabled: false

  execution:
    # The executor (ADR-0020). It acts only in policy mode EXECUTE_ON_APPROVAL; this switch stops every external
    # write of the deployment, while reads, verification and reconciliation continue.
    mutations-enabled: ${OPERATOR_MUTATIONS_ENABLED:true}
    authorization-ttl: 60s
    lease-duration: 2m
    max-pauses-per-store-24h: 3
    cooldown-per-ad: 24h

  outcomes:
    # Observation checkpoints of verified outcomes (ADR-0021 point 5), observed in the worker profile.
    observe-interval: 10m

  notifications:
    # Operator notifications (ADR-0021): stored first, e-mailed to everyone with DECISION_APPROVE. The pilot's
    # MailProvider only logs deliveries until a provider is chosen (O-11).
    sweep-enabled: true
    retry-interval: 5m
    max-attempts: 5
    claim-duration: 1m
    app-base-url: ${OPERATOR_APP_BASE_URL:http://localhost:3000}

  row-security:
    # Second line of store isolation (ADR-0022): sets the bound store scope on every connection. Off only for local
    # diagnosis; the cloud profile refuses to start without it. Unbound, store tables show no rows either way.
    enabled: true

  retention:
    # Off until the periods are approved (ADR-0022 point 5, O-03). Runs in the worker profile.
    enabled: false
    interval: 24h
    batch-size: 1000
    max-batches: 100
    periods:
      webhook-inbox: 30d
      outbox: 30d
      agent-run-content: 90d
      notifications: 180d
      # The audit trigger refuses entries younger than 365 days whatever this says.
      audit: 400d

  agent:
    # The agent proposer (ADR-0016). Off: the deterministic baseline is the only proposer.
    enabled: ${OPERATOR_AGENT_ENABLED:false}
    # Model policy INVENTORY_BALANCED: attempts in order on the same snapshot, sharing the run limits' cost.
    models:
      - anthropic/claude-opus-5-5
      - anthropic/claude-sonnet-5-5
    effort: low
    max-output-tokens-per-call: 1500
    # USD per million tokens. Check against the provider before switching the agent on; change the version with it.
    price-list:
      version: anthropic-2026-11
      models:
        "[anthropic/claude-opus-5-5]":
          input: "4.00"
          output: "20.00"
        "[anthropic/claude-sonnet-5-5]":
          input: "2.00"
          output: "10.00"

springdoc:
  api-docs:
    # The contract is generated in tests (OpenApiContractTest) and committed; not served by default.
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  default-produces-media-type: application/json

logging:
  structured:
    # JSON logs (Elastic Common Schema) with MDC fields: requestId, correlationId, traceId, spanId.
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false # logs go to stdout as JSON
  otlp:
    metrics:
      export:
        enabled: false # metrics export is chosen with hosting (F4)
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
