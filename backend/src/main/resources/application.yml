spring:
  application:
    name: ecommerce-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/operator}
    username: ${DB_USERNAME:operator}
    password: ${DB_PASSWORD:operator}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/operator}
          # Tokens must be minted for this API, not just by the same identity provider.
          audiences: ${OIDC_AUDIENCE:operator-api}
  jackson:
    time-zone: UTC
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers-auto-discovery:
      packages: com.ecommerceagent.automation
    # Workers run only in the "worker" profile; "api" uses the client to start workflows.
    start-workers: false

operator:
  integration:
    # Base64 of 32 random bytes (AES-256). Required; never reuse the local key elsewhere (ADR-0007).
    secrets-key: ${INTEGRATION_SECRETS_KEY:}
    secrets-key-id: ${INTEGRATION_SECRETS_KEY_ID:v1}
    woocommerce:
      allow-insecure-http: false
      allow-private-network: false
      connect-timeout: 5s
      read-timeout: 10s
    webhooks:
      # Public address of this API that shops deliver webhooks to (ADR-0009), e.g. https://api.example.com
      base-url: ${WEBHOOK_BASE_URL:}
      processor-enabled: true
      processor-interval: 2s
  automation:
    # Outbox → Temporal (ADR-0010); runs in the worker profile.
    dispatcher-enabled: true
    dispatcher-interval: 1s
    inventory:
      # Fresh read after a verification request, and after an order change without a newer stock state.
      verify-delay: 10s
      order-delay: 60s
    catalog:
      refresh-delay: 30s

springdoc:
  api-docs:
    # The contract is generated in tests (OpenApiContractTest) and committed; not served by default.
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  default-produces-media-type: application/json

logging:
  structured:
    # JSON logs (Elastic Common Schema) with MDC fields: requestId, correlationId, traceId, spanId.
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false # logs go to stdout as JSON
  otlp:
    metrics:
      export:
        enabled: false # metrics export is chosen with hosting (F4)
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
