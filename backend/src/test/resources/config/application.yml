# Test-only settings, merged over src/main/resources/application.yml.
operator:
  # Many tests share users and stores within a minute; ApiRateLimitTest sets its own low limits.
  api-rate-limits:
    version: api-rate-limits/900
    work-per-user-per-minute: 100000
    work-per-store-per-minute: 100000
    work-per-endpoint-per-minute: 100000
    webhooks-per-endpoint-key-per-minute: 100000
  sync:
    # Tests call SyncRunReconciler directly instead of waiting for the schedule.
    reconciler-enabled: false
  integration:
    secrets-key: +8ixWUDP7q0PlVTSA1mCnWZsD8tYl+VhgMS+hqXdv1w=
    secrets-key-id: test-v1
    woocommerce:
      # Tests call a stub WooCommerce server on localhost over HTTP.
      allow-insecure-http: true
      allow-private-network: true
      response-timeout: 2s
    webhooks:
      base-url: https://api.example.test
      # Tests drain the inbox explicitly.
      processor-enabled: false
    meta:
      # Tests call MetaAdSync directly.
      poller-enabled: false
  automation:
    # Tests dispatch the outbox explicitly; short delays keep workflow tests fast.
    dispatcher-enabled: false
    inventory:
      verify-delay: 1s
      order-delay: 2s
    catalog:
      refresh-delay: 1s
  inventory-guardian:
    risk:
      # Short gap so workflow tests see the confirming read open an episode.
      min-gap: 2s
    sync:
      # The Temporal test server has no schedules; tests start IncrementalSyncWorkflow directly.
      schedules-enabled: false
