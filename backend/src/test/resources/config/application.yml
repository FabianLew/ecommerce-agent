# Test-only settings, merged over src/main/resources/application.yml.
operator:
  integration:
    secrets-key: +8ixWUDP7q0PlVTSA1mCnWZsD8tYl+VhgMS+hqXdv1w=
    secrets-key-id: test-v1
    woocommerce:
      # Tests call a stub WooCommerce server on localhost over HTTP.
      allow-insecure-http: true
      allow-private-network: true
      read-timeout: 2s
    webhooks:
      base-url: https://api.example.test
      # Tests drain the inbox explicitly.
      processor-enabled: false
  automation:
    # Tests dispatch the outbox explicitly; short delays keep workflow tests fast.
    dispatcher-enabled: false
    inventory:
      verify-delay: 1s
      order-delay: 2s
    catalog:
      refresh-delay: 1s
    sync:
      # The Temporal test server has no schedules; tests start IncrementalSyncWorkflow directly.
      schedules-enabled: false
